<wicket:panel>
		
		<div class="row">
			<div class="mt-1 mb-1 col-xs-12 col-sm-12 col-md-12 col-lg-12 col-xl-12 col-xxl-12">
				
				<div style="float:left; width:100%;">
					<div class="icon-expander d-none d-md-block d-lg-block d-xl-block d-xxl-block" style="float:left; width:2.5em; margin-right:10px;">
						<a wicket:id="expand" style="float:left; padding:0.3em 0.5em;" class="border rounded"><i wicket:id="icon"></i></a> 
					</div>
					<div wicket:id="row-element" />
				</div>	
			
				<div style="margin-left:3em; float:left;     width: calc(100% - 3em); margin-top: 1em;" wicket:id="expanded-panel" />	
			
			</div>
		</div>
</wicket:panel>
